<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>flexbox</title>
    <style>
        .midcontainer{
            display: flex;
            flex-wrap: wrap;/*allign items till endline and go to new line */
            flex-direction: column;/*one column of many line/row one*/
            align-items: stretch;
            height: 100%;
        }
        /*max-width for desktop first: ab max infini bis 600px defaut.bis 300px*/
        @media screen and  (max-width: 300px) {
            .top{
                background-color: red;

            }

            .b{/*body */
                flex-direction: column;
            }
            .left{
                background-color:black;
                #width: 100%;
            }
            .right{
                background-color: violet;
                #width: 100%;

            }
            article{
                background-color: blue;
                width: 100%;
            }
            .boto{
                
                margin: 1px;
            }


        }
        /*___________________________________________________ */
        @media screen and  (max-width: 600px)/*and (orientation: landscape) */ {
            .top{
                background-color: red;
                height: 5rem;
            }

            .b{/*body */
                display: flex;
                #flex-direction: column;
                height: 15rem;
            }
            .left{
                background-color: lawngreen;
                flex-grow: 1;
            }
            .right{
                background-color: violet;
                width: 100%;
            }
            article{
                background-color: blue;
                flex-grow: 1.5;
            }
            .boto{

                height: 5rem;
                margin: 1px;
            }

        }
        /*___________________________________________________ */


            .top{
            background-color: red;
            height: 5rem;
        }

        .b{/*body */
            display: flex;
            flex-direction: row;
            height: 30rem;
        }
        .left{
            background-color: lawngreen;
            flex-grow: 1;
        }
        .right{
            background-color: violet;
            flex-grow: 1;
        }         /*flex grow :relativ grow of the child between them*/

        article{
            background-color: blue;
            flex-grow: 2;
        }
        .boto{
            height: 5rem;
            margin: 1px;
        }

        .d2{
            background-color: darkcyan;
            width: 50%;    }
        *{
            box-sizing: border-box;
            margin: 1px;

        }
    </style>

</head>
<body >
<div class="container">
    <div class="container top"></div>
    <div class="container  b">
         <aside class="left"></aside>
         <article></article>
        <aside class="right"></aside>
    </div>
    <div class="container boto">
        <div class="boto d2 "></div>
        <div class="boto d2"></div>
    </div>
</div>
</body>
