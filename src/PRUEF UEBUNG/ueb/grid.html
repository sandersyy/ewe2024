<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>grid</title>
    <script src="jscript/jscript.js"></script>
    <style>
        @media screen and  (min-width: 600px){
        .midcontainer {  display: grid;
            grid-template-columns: 0.6fr 1.8fr 0.6fr;
            grid-template-rows: 0.8fr 1.8fr;
            gap: 0 0;
            grid-auto-flow: row;
        }

        .top {
            grid-area: 1 / 1 / 2 / 4;
            background-color: red;}

        .body {
            grid-area: 2 / 2 / 3 / 3;
            background-color: blue;}

        .sider {
            grid-area: 2 / 3 / 3 / 4;
            background-color: blueviolet;}

        .sidel {
            grid-area: 2 / 1 / 3 / 2;
            background-color: lawngreen;}
        }
        @media screen and  (min-width: 300px)and  (max-width: 600px){
        .midcontainer {  display: grid;
            grid-template-columns: 0.6fr 1.8fr ;
            grid-template-rows: 0.6fr 1.8fr 1.8fr;
            gap: 0 0;
            grid-auto-flow: row;
        }

        .top {
            grid-area: 1 / 1 / 2 / 3;  /*from line 1 to line 2/from colomn 1 to colomn 3*/
            background-color: red;}

        .body {
            grid-area: 2 / 2 / 3 / 3;
            background-color: blue;}

        .sider {
            grid-area: 3 / 1 / 4 / 3;
            background-color: blueviolet;}

        .sidel {
            grid-area: 2 / 1 / 3 / 2;
            background-color: lawngreen;}
        }
        @media screen and (max-width: 300px){
        .midcontainer {  display: grid;
            grid-template-columns: 1fr ;
            grid-template-rows: 0.6fr 1.5fr 1.5fr 1.5fr;
            gap: 0 0;
            grid-auto-flow: row;
        }

        .top {
            grid-area: 1 / 1 / 2 / 2; /*one column of many line/row one*/
            background-color: red;}

        .body {
            grid-area: 2 / 1 / 3 / 2;
            background-color: blue;}

        .sidel {
            grid-area: 3 / 1 / 4 / 2;
            background-color: lawngreen;}
        .sider {
                grid-area: 4 / 1 / 5 / 2; /*from line 4 to line 5/from colomnline 1 to colomnline 2// only one row*/
                background-color: blueviolet;}
        }

        *{
            margin:1px;
        }
        .midcontainer {
            height: 30rem;
           
        }
        .midcontainer *:after {
           
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: grid;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body >
<div class="container">
    <div class="top"></div>
    <div class="body"></div>
    <div class="sider"></div>
    <div class="sidel"></div>
</div>
</body>
